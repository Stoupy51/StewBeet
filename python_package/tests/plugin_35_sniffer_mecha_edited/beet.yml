
# Test: stewbeet.plugins.sniffer on a function a plugin edits before mecha compiles it.
# simple_item_plugin prepends a scoreboard line to the load function of every project using it, and
# mecha's positions then count lines of the edited text. The map must still name the line on disk
# each command was written on, and the prepended line comes from the Python that prepended it.

id: "tns"
name: "Test Sniffer Mecha Edited"
version: "1.0.0"
author: "test"
minecraft: "26.2"

directory: "."
output: "build"

require:
    # src.assertions is listed first and yields, so its checks run last of all, after the sniffer
    # in the same list has mapped what mecha compiled. beet unwinds `require` in reverse too.
    - "src.assertions"
    - "stewbeet.plugins.sniffer"

data_pack:
    name: "datapack"
    load: ["src"]

pipeline:
    - "src.prepend"
    - "mecha"

