# Test: a versioning plugin moves every function before mecha ever parses one.
# `simple_item_plugin` requires the refactor and then mecha, in that order, which is the harder of
# the two and the one a real project hits. `find_replace` substitutes inside every file in the
# pack, and beet drops a file's `source_path` the moment its text is read, so by the time mecha
# parses, not one compilation unit can say which file it came from. What the capture hook noted
# while the pack was loading is what puts the names back.
#
# plugin_31 is the same refactor on the other side of the compile, where the resource locations
# move out from under units mecha has already filed.

id: "tns"
name: "Test Sniffer Versioned Early"
version: "1.0.0"
author: "test"
minecraft: "26.2"

directory: "."
output: "build"

require:
    # src.assertions is listed first and yields, so its checks run last of all, after the sniffer
    # in the same list has written both kinds of map. beet unwinds `require` in reverse too.
    - "src.assertions"
    - "bolt"
    - "stewbeet"
    - "stewbeet.plugins.sniffer"

data_pack:
    name: "datapack"
    load: ["src"]

pipeline:
    - "src.link"
    # Neither of these yields, so both have finished before mecha is even required.
    - "src.versioning"
    - "mecha"
    - "stewbeet.plugins.auto.headers.silent"

meta:
    bolt:
        entrypoint: "*"
