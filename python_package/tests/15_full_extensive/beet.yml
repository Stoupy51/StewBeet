
# Test 15 - Full Extensive Template
# Runs the complete extensive template pipeline but skips heavy plugins:
#   - No resource_pack.item_models (needs model_resolver rendering)
#   - No ingame_manual (heavy, requires image generation)
#   - No archive / merge_smithed_weld / copy_to_destination / compute_sha1 (output-only)
#   - No check_unused_textures (would flag unreferenced files as errors)
# References assets from the extensive template via relative paths.
id: "_your_namespace"
name: "Extensive Template"
description: ""
author: "Stoupy51"
version: "3.0.0"
minecraft: "26.1"
directory: "."
output: "build"
ignore: ["build", "definitions_debug.json"]

require:
    - "stewbeet"
    - "bolt"

data_pack:
    name: "datapack"
    load: ["src"]

resource_pack:
    name: resource_pack
    load: ["src"]

pipeline:
    - "src.setup_definitions"
    - "stewbeet.plugins.resource_pack.sounds"
    - "stewbeet.plugins.resource_pack.check_power_of_2"
    - "stewbeet.plugins.custom_recipes"
    - "stewbeet.plugins.custom_paintings"
    - "stewbeet.plugins.datapack.loading"
    - "stewbeet.plugins.datapack.custom_blocks"
    - "stewbeet.plugins.datapack.loot_tables"
    - "stewbeet.plugins.datapack.sorters"
    - "stewbeet.plugins.compatibilities.simpledrawer"
    - "stewbeet.plugins.compatibilities.neo_enchant"
    - "src.link"
    - "mecha"
    - "stewbeet.plugins.finalyze.custom_blocks_ticking"
    - "stewbeet.plugins.finalyze.basic_datapack_structure"
    - "stewbeet.plugins.finalyze.dependencies"
    - "stewbeet.plugins.finalyze.unload"
    - "stewbeet.plugins.finalyze.last_final"
    - "stewbeet.plugins.auto.scoreboard_constants"
    - "stewbeet.plugins.auto.lang_file"
    - "stewbeet.plugins.auto.headers"

meta:
    mc_supports: ["1.21.11", "infinite"]

    model_resolver:
        use_cache: true

    mecha:
        multiline: true
        formatting: preserve

    stewbeet:
        # Reference the extensive template's assets (relative to this test folder)
        textures_folder: "../../../templates/extensive/assets/textures"
        sounds_folder: "../../../templates/extensive/assets/sounds"
        records_folder: "../../../templates/extensive/assets/records"
        source_lore: "auto"
