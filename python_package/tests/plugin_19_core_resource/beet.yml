
# Test: stewbeet.core.cls.resource
# Verifies that the Resource accessors on Item/Block/Painting resolve to the
# exact resource locations the plugins write to, and that .obj/.get()/.exists()
# reach the real beet files.

id: "tns"
name: "Test Core Resource"
version: "1.0.0"
author: "test"
minecraft: "26.2"

directory: "."
output: "build"

require:
    - "stewbeet"

data_pack:
    name: "datapack"
    load: ["src"]

resource_pack:
    name: "resource_pack"
    load: ["src"]

pipeline:
    - "src.definitions"
    - "stewbeet.plugins.datapack.loot_tables"
    - "stewbeet.plugins.datapack.custom_blocks"
    - "src.assertions"

meta:
    stewbeet:
        source_lore: "auto"
        textures_folder: "../../../templates/extensive/assets/textures"
