
# Test 10 - Custom Records
# Tests: generate_custom_records("auto") with jukebox song creation
# References sounds/records from the extensive template (no binary files copied)
id: "test_ns"
name: "Test Custom Records"
author: "Tester"
version: "1.0.0"
minecraft: "26.1"
directory: "."
output: "build"

require:
    - "stewbeet"
    - "bolt"

data_pack:
    name: "datapack"
    load: ["src"]

resource_pack:
    name: "resource_pack"
    load: ["src"]

pipeline:
    - "src.definitions"
    - "stewbeet.plugins.resource_pack.sounds"
    - "stewbeet.plugins.custom_recipes"
    - "stewbeet.plugins.datapack.loading"
    - "stewbeet.plugins.datapack.custom_blocks"
    - "stewbeet.plugins.datapack.loot_tables"
    - "stewbeet.plugins.datapack.sorters"
    - "mecha"
    - "stewbeet.plugins.finalyze.custom_blocks_ticking"
    - "stewbeet.plugins.finalyze.basic_datapack_structure"
    - "stewbeet.plugins.finalyze.dependencies"
    - "stewbeet.plugins.finalyze.unload"
    - "stewbeet.plugins.finalyze.last_final"
    - "stewbeet.plugins.auto.scoreboard_constants"
    - "stewbeet.plugins.auto.lang_file"

meta:
    stewbeet:
        # Reference the extensive template's sounds and records (relative to this test folder)
        sounds_folder: "../../../templates/extensive/assets/sounds"
        records_folder: "../../../templates/extensive/assets/records"

    mecha:
        multiline: true
        formatting: preserve
