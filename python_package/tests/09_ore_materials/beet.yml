
# Test 09 - Ore Materials
# Tests: generate_everything_about_these_materials with EquipmentsConfig
# References textures from the extensive template (no binary files copied)
id: "test_ns"
name: "Test Ore Materials"
author: "Tester"
version: "1.0.0"
minecraft: "26.1"
directory: "."
output: "build"

require:
    - "stewbeet"
    - "bolt"

data_pack:
    name: "datapack"
    load: ["src"]

pipeline:
    - "src.definitions"
    - "stewbeet.plugins.custom_recipes"
    - "stewbeet.plugins.datapack.loading"
    - "stewbeet.plugins.datapack.custom_blocks"
    - "stewbeet.plugins.datapack.loot_tables"
    - "stewbeet.plugins.datapack.sorters"
    - "mecha"
    - "stewbeet.plugins.finalyze.custom_blocks_ticking"
    - "stewbeet.plugins.finalyze.basic_datapack_structure"
    - "stewbeet.plugins.finalyze.dependencies"
    - "stewbeet.plugins.finalyze.unload"
    - "stewbeet.plugins.finalyze.last_final"
    - "stewbeet.plugins.auto.scoreboard_constants"
    - "stewbeet.plugins.auto.lang_file"

meta:
    stewbeet:
        # Reference the extensive template's textures (relative to this test folder)
        textures_folder: "../../../templates/extensive/assets/textures"

    mecha:
        multiline: true
        formatting: preserve
