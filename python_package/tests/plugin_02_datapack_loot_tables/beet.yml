
# Test: stewbeet.plugins.datapack.loot_tables
# Verifies per-item loot tables, skip_gives exclusion, count variant tables,
# creative_loot_table, and the _give_all function.

id: "tns"
name: "Test Datapack Loot Tables"
version: "1.0.0"
author: "test"
minecraft: "26.1"

directory: "."
output: "build"

require:
    - "stewbeet"

data_pack:
    name: "datapack"
    load: ["src"]

resource_pack:
    name: "resource_pack"
    load: ["src"]

pipeline:
    - "src.definitions"
    - "stewbeet.plugins.datapack.loot_tables"
    - "src.assertions"

meta:
    stewbeet:
        source_lore: "auto"
