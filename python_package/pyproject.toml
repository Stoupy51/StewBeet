
[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[project]
name = "stewbeet"
version = "3.6.0"
description = "Beet Framework made to help generating advanced Minecraft datapack contents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
classifiers = [
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.14",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
]
authors = [
    { name = "Stoupy51", email = "stoupy51@gmail.com" },
]
dependencies = [
	"stouputils>=26.0.3",
	"model_resolver>=1.15.2",
	"beet>=0.116.0",
	"bolt>=0.50.1",
	"mecha>=0.104.1",
	"mutagen>=1.48.1",
	"pyperclip>=1.11.0",
	"fsspec>=2026.7.0",
	"paramiko>=5.0.0",
	"smithed",
]

[tool.uv.sources]
smithed = { git = "https://github.com/Stoupy51/smithed-python" }

[project.urls]
Homepage = "https://stewbeet.paralya.fr"
Issues = "https://github.com/Stoupy51/stewbeet/issues"
Repository = "https://github.com/Stoupy51/stewbeet"

[project.scripts]
stewbeet = "stewbeet:main"

[dependency-groups]
dev = [
    "bumpversion",  # bump-my-version bump patch
    "pyright",
    "ruff",
]

[tool.pyright]
typeCheckingMode = "strict"

[tool.ruff]
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "build",
    "dist",
    "*.pyi",
]
line-length = 200

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "T20",
    "RUF",
]
ignore = [
    "T201",
    "W191",
    "N803",
    "N806",
    "F403",
    "F405",
]

# Bumpversion configuration
[tool.bumpversion]
current_version = "3.6.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"

# List each file where the version appears
[[tool.bumpversion.files]]
filename = "pyproject.toml"

[[tool.bumpversion.files]]
filename = "../docs/web/public/docs/0_getting_started/en.md"

[[tool.bumpversion.files]]
filename = "../docs/web/public/docs/0_getting_started/fr.md"

[[tool.bumpversion.files]]
filename = "../templates/minimal/pyproject.toml"

[[tool.bumpversion.files]]
filename = "../templates/basic/pyproject.toml"

[[tool.bumpversion.files]]
filename = "../templates/extensive/pyproject.toml"

