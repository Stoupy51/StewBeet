
name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: 3.14
      - name: Install project with python 3.14
        run: |
          cd ./python_package
          uv venv
          uv pip install -e .
      - name: Ruff lint with python 3.14
        run: uv run ruff check ./stewbeet
      - name: Pyright type check with python 3.14
        run: uv run pyright ./stewbeet

