
name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: 3.14
      - name: Install project with python 3.14
        run: |
          cd ./python_package
          uv venv
          uv pip install -e .
      - name: Ruff lint with python 3.14
        run: cd ./python_package && uv run ruff check ./stewbeet
      - name: Check the generated re-exports and lazy markers are in sync
        run: cd ./python_package && uv run scripts/sync_api.py --check
      - name: Pyright type check with python 3.14
        run: cd ./python_package && uv run pyright ./stewbeet

