
name: tests-by-python

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to run tests
        required: true
        type: string

jobs:
  tests:
    name: py${{ inputs.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install system dependencies (in case subpackages that do not have wheels require them)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake zlib1g-dev libjpeg-dev libpng-dev libtiff-dev libwebp-dev libffi-dev
      - name: Install project with python ${{ inputs.python-version }}
        run: |
          cd ./python_package
          uv venv
          uv pip install -e .
      - name: Run doctests with python ${{ inputs.python-version }}
        run: cd ./python_package && uv run stouputils all_doctests ./stewbeet
      - name: Run integration tests with python ${{ inputs.python-version }}
        run: cd ./python_package && uv run scripts/run_integration_tests.py
      # Rebuilds the landing page hero project and fails if the committed output in docs/web is
      # stale. Passing here on a runner with no display is also what proves the committed iso
      # renders keep model_resolver, and the OpenGL context behind it, out of that build.
      - name: Check the hero output committed in docs/web is up to date
        run: cd ./python_package && uv run scripts/build_hero_output.py --check

