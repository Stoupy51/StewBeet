
# The project the playground builds visitor code with.
id: "playground"
name: "Playground"
version: "1.0.0"
author: "you"
minecraft: "26.2"

directory: "."

require:
    - "stewbeet"

data_pack:
    name: "datapack"
    load: ["src"]

resource_pack:
    name: "resource_pack"
    load: ["src"]

# Everything that runs without a display, a network or an output directory.
pipeline:
    - "src.user_code"
    - "src.placeholders"    # Plugin that generates placeholders for non-existing textures
    - "stewbeet.plugins.resource_pack.item_models"
    - "stewbeet.plugins.custom_recipes"
    - "stewbeet.plugins.datapack.loading"
    - "stewbeet.plugins.datapack.custom_blocks"
    - "stewbeet.plugins.datapack.loot_tables"
    - "stewbeet.plugins.datapack.sorters"
    - "stewbeet.plugins.finalyze.basic_datapack_structure"
    - "stewbeet.plugins.auto.scoreboard_constants"
    - "stewbeet.plugins.auto.lang_file"
    - "stewbeet.plugins.auto.text_renders"
    - "stewbeet.plugins.auto.headers"

meta:
    stewbeet:
        textures_folder: "../textures"
        iso_renders_path: "../iso_renders"
        source_lore: "auto"
        text_renders:
            allow_oversized: true
            cache_assets: true

