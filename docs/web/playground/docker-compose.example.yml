# Example compose for the deployment host, where the real docker-compose.yml lives.
#
# Copy the parts you need into it. Every sandbox-backed tool is off until SANDBOX_WORKER_URL is set,
# so the web service keeps working unchanged if you deploy the site without this.
#
#   docker compose build --no-cache && docker compose up -d --force-recreate

networks:
  web: {}

  # The load bearing line of this whole file. Docker creates this bridge with no gateway, so the
  # worker has no route off it and no application code has to enforce that. The web service sits on
  # both networks and still resolves `playground-worker` through the embedded DNS.
  playground:
    internal: true

services:
  stewbeet-web:
    build:
      context: .
      dockerfile: Dockerfile
    networks: [web, playground]
    ports: ["4173:4173"]
    environment:
      # Base URL, not an endpoint: the web service calls /build for the playground and /headers for
      # the auto.headers tool.
      SANDBOX_WORKER_URL: "http://playground-worker:8000"
      # Read x-forwarded-for instead of the socket address. Only turn this on behind a reverse
      # proxy you control: with it on, anyone reaching the port directly can spoof their rate limit
      # bucket by setting the header themselves.
      TRUST_PROXY: "1"
    restart: unless-stopped

  playground-worker:
    build:
      context: ./playground/sandbox
    networks: [playground]

    # `expose`, never `ports`. Publishing this to the host would put an arbitrary code execution
    # endpoint on the internet with no rate limiting in front of it.
    expose: ["8000"]

    # ── Disk─────────────────────────────────
    # The image and the host filesystem are unwritable, so the only place a job can write is the
    # tmpfs below. This is the actual guarantee; the rlimits in jobs.py are the refinement.
    #
    # 384m rather than 128m since auto.headers landed: a 25 MB upload, the 192 MB it may extract to
    # and the archive written back all live here at once.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=384m,mode=1777

    # ── Memory───────────────────────────────
    # memswap_limit must equal mem_limit. Without it the memory limit is simply bypassed by
    # swapping, and the container happily grows past its limit.
    #
    # Note that the tmpfs above is charged to this same cgroup: scratch disk and memory are one
    # budget, not two. A job trying to fill /tmp runs into this limit rather than the host's disk.
    # 2g is the 384m tmpfs plus the 768 MiB address space a headers job may map, with headroom.
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.0

    # ── Process──────────────────────────────
    # pids_limit is how a fork bomb is contained. jobs.py deliberately does not set RLIMIT_NPROC,
    # because that limit is per uid and would let one request lock out every later one.
    pids_limit: 96

    # Not optional. Without it the worker is PID 1, so every process a build orphans is reparented
    # to it and stays a zombie holding a pid. One fork bomb was enough to fill pids_limit and leave
    # the worker unable to spawn a thread for the next connection: the service answered one request
    # with a dropped connection and never recovered. tini reaps them instead.
    init: true
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    user: "10001:10001"
    restart: unless-stopped

    # Never add to this service: `privileged`, a /var/run/docker.sock mount, any bind mount, any
    # `cap_add`, or `seccomp:unconfined`. Every one of them turns arbitrary code execution in a
    # container into arbitrary code execution on the host.
    #
    # If the host has gVisor installed, add `runtime: runsc` for a second kernel boundary.
